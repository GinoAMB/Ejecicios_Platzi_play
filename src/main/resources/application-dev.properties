server.port=8090

#Spring Data JPA
spring.datasource.url=jdbc:postgresql://localhost:5433/platzi_play_db
spring.datasource.username=gino
spring.datasource.password=demon

# Actualiza la tabla según los cambios en las entidades, sin borrar datos
spring.jpa.hibernate.ddl-auto=update  

# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true  

# Hace que las consultas SQL se vean ordenadas
spring.jpa.properties.hibernate.format_sql=true  

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


#langchain4j
langchain4j.open-ai.chat-model.api-key=demo

# Activa el log de las solicitudes que la app envía al modelo de OpenAI.
# Esto muestra el prompt, parámetros y demás datos enviados.
langchain4j.open-ai.chat-model.log-requests=true

# Activa el log de las respuestas que devuelve el modelo de OpenAI.
# Sirve para ver los resultados completos, tokens y tiempos de respuesta.
langchain4j.open-ai.chat-model.log-responses=true

# Define el nivel de logging de la librería LangChain4j en DEBUG.
# Muestra mensajes internos detallados (flujo, pasos, depuración).
logging.level.dev.langchain4j=DEBUG

# Define el nivel de logging de la librería OpenAI4j en DEBUG.
# Muestra información detallada de las solicitudes/respuestas HTTP a la API.
logging.level.dev.ai4j.openai4j=DEBUG

